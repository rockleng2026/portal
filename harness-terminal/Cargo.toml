[package]
name = "harness-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "The harness terminal agent: collects context, acts with tools, verifies the result, repeats."

[[bin]]
name = "harness-agent"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime + HTTP (the model providers and the MCP stdio client)
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Async traits (the model implementations are async)
async-trait = "0.1"

# Errors
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem traversal with gitignore support
ignore = "0.4"
walkdir = "2.5"

# Text search
grep = "0.3"
grep-searcher = "0.1"
grep-printer = "0.1"

# Token estimation. A rough heuristic on purpose: the context budget needs to be
# conservative and stable, not byte-exact, and a real tokenizer is a 40 MB dependency.
# (The estimate is deliberately over-counting, so the budget is never exceeded.)

# Digests (device id, skill signatures)
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = "2.1"

# UUIDv7
uuid = { version = "1.10", features = ["v7", "v4"] }

# Misc
regex = "1.11"
similar = "2.6"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
