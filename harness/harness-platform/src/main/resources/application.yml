spring:
  application:
    name: harness-platform
  datasource:
    url: ${HARNESS_DB_URL:jdbc:mysql://127.0.0.1:3306/harness?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${HARNESS_DB_USER:harness}
    password: ${HARNESS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${HARNESS_DB_POOL:20}
      pool-name: harness-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${HARNESS_REDIS_HOST:127.0.0.1}
      port: ${HARNESS_REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
  jackson:
    default-property-inclusion: non_null

server:
  port: ${HARNESS_PORT:8080}
  error:
    include-message: never

harness:
  security:
    clock-skew: 300s
    nonce-ttl: 5m
    binding-code-ttl: 10m
  terminal:
    heartbeat-timeout: 30s
    degrade-after: 15m
  bootstrap:
    client-id: harness-bootstrap
    secret: ${HARNESS_BOOTSTRAP_SECRET:}
    # The first natural-human console principal. Without it every human-only endpoint
    # (grant issue, approval decision, kill switch, agent lifecycle) is unreachable.
    human-client-id: ${HARNESS_HUMAN_CLIENT_ID:}
    human-secret: ${HARNESS_HUMAN_SECRET:}
    human-employee-id: ${HARNESS_HUMAN_EMPLOYEE_ID:}
  federation:
    local-fed-id: ${HARNESS_FED_ID:}
  portal:
    # portal 的根地址（含 context path）。没配置就不能入职——控制台会说明原因，
    # 而不是让人手填一个查不到的 employee id。
    base-url: ${HARNESS_PORTAL_BASE_URL:}
    client-id: ${HARNESS_PORTAL_CLIENT_ID:harness-bootstrap}
    secret: ${HARNESS_PORTAL_SECRET:${HARNESS_BOOTSTRAP_SECRET:}}
  model:
    # 加密模型密钥用的平台密钥；不设置则从 bootstrap secret 派生
    encryption-key: ${HARNESS_MODEL_ENCRYPTION_KEY:}
  skill:
    # 技能版本签名的平台密钥；不设置则从 bootstrap secret 派生
    signing-key: ${HARNESS_SKILL_SIGNING_KEY:}
  scheduler:
    terminal-scan-ms: 60000
    approval-expiry-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.fuao.harness: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:--}] %logger{36} - %msg%n"