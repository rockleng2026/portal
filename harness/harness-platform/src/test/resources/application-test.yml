spring:
  datasource:
    url: jdbc:mysql://localhost:3307/harness?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: harness
    password: harness
    hikari:
      maximum-pool-size: 4
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

harness:
  security:
    clock-skew: 300s
    nonce-ttl: 5m
    binding-code-ttl: 10m
  terminal:
    heartbeat-timeout: 30s
  bootstrap:
    client-id: harness-test-service
    secret: test-only-secret-value-0123456789

logging:
  level:
    com.fuao.harness: INFO
    org.springframework: WARN
    org.testcontainers: WARN
