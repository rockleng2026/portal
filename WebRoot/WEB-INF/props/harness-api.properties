# =====================================================================================
# Harness API namespace configuration (/api/harness/**)
#
# The portal authenticates humans with a reversible cookie password. The harness namespace
# authenticates machine callers with HMAC signatures instead, and the two systems share no
# credential material (ADR-004, 01 §2.1 conclusion B).
#
# The signing key on both sides is hex(sha256(secret)) - the platform stores exactly that value
# in harness_principal.secret_hash and never the secret itself.
#
# Canonical string (03 §9), byte-identical on both sides:
#     METHOD \n PATH \n TIMESTAMP \n NONCE \n hex(sha256(body))
#
# Set harness.api.enabled=true only after the platform has been configured with the same secret.
# While it is false every call to the namespace is refused with 503.
# =====================================================================================

harness.api.enabled=false

# The client id the platform presents. It must match harness_principal.client_id.
harness.api.clientId=harness-platform

# Shared secret. At least 24 characters. Generate with:
#   openssl rand -hex 24
# Rotate it by changing it here and in the platform's principal record at the same time;
# during the rotation window both values must be accepted, so plan a short overlap.
harness.api.secret=CHANGE_ME__at_least_24_characters_long

# How far a request timestamp may be from the portal's clock, in seconds.
harness.api.clockSkewSeconds=300

# How long a nonce is remembered, in seconds. Must be at least the clock skew.
#
# NOTE: the nonce cache lives in the memory of the node that handled the request. In a portal
# cluster this makes replay protection per-node rather than global. Put the namespace behind a
# sticky session, or move the cache to Redis, before running more than one node.
harness.api.nonceTtlSeconds=300