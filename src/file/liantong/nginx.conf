user  www www;
 
worker_processes 4;

error_log  /usr/local/nginx/logs/nginx_error.log  crit;

pid        /usr/local/nginx/nginx.pid;

#Specifies the value for maximum file descriptors that can be opened by this process. 
worker_rlimit_nofile 65535;

events 
{
  use epoll;
  worker_connections 65535;
}

http {
    include       mime.types;
    include       proxy.conf;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;

    keepalive_timeout  300;
    tcp_nodelay on;

      gzip on;
  gzip_min_length  1k;
  gzip_buffers     4 16k;
  gzip_comp_level 4;
  gzip_disable "MSIE [1-6] \.";
  gzip_types text/plain application/xhtml+xml text/xml application/xml application/xml+rss;  
  gzip_vary on;

  server_tokens off;

  log_format nginx '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" "$request_time"'
                        '$upstream_cache_status '
                        '$upstream_response_time '
                        '$msec request_time $request_time'
                        '$upstream_http_content_type'
                        '"$request_length" "$connection" "$bytes_sent"';

    server {
        listen       80;
        server_name  localhost;
        location / {
            root   html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

      }

proxy_cache_path /data0/proxy_temp_dir/dzxw.net levels=1:2 keys_zone=dzxw:200m inactive=30d max_size=20g;
#proxy_cache_path /data0/proxy_temp_dir/fuaotech levels=1:2 keys_zone=fuao:50m inactive=1d max_size=1g;
proxy_cache_path /data0/proxy_temp_dir/www.guosechina.com levels=1:2 keys_zone=guosechina:100m inactive=6h max_size=10g;
proxy_cache_path /data0/proxy_temp_dir/cache.52dangong.com levels=1:2 keys_zone=52dangong:100m inactive=1d max_size=10g;
proxy_cache_path /data0/proxy_temp_dir/xz5u.cn levels=1:2 keys_zone=xz5u:100m inactive=10d max_size=10g;
#proxy_cache_path /data0/proxy_temp_dir/www.55you.com levels=1:2 keys_zone=55you:200m inactive=10d max_size=10g;
   upstream  backsquid {
       server 127.0.0.1:81;
      # server 127.0.0.1:82;
       #fair;
       hash   $request_uri;
      # hash_method crc32;
   }
      upstream  backsquid2 {
       server 127.0.0.1:82;
      # server 60.217.58.112:82;
      fair;
      hash   $request_uri;
      # hash_method crc32;
   }
       upstream  sdbgp {
       ip_hash;
       server 58.59.97.2:9999;
      # server 60.217.58.112:82;
      #fair;
      # hash   $request_uri;
      # hash_method crc32;
   }



