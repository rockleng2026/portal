acl all src 0.0.0.0/0.0.0.0
acl manager proto cache_object
acl localhost src 127.0.0.1/255.255.255.255
acl to_localhost dst 127.0.0.0/8
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 81          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 3130        # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl safeprotocol protocol HTTP
acl allowmethod method GET POST HEAD
acl CONNECT method CONNECT
acl purgeip src 58.59.97.3 222.134.7.27
acl purge method PURGE
acl cachemgr proto cache_object
acl cachemgrip src 58.59.97.3 222.134.7.27
acl cachemgrip src localhost
cachemgr_passwd disable config shutdown authenticator offline_toggle
cachemgr_passwd none info stats/objects
cachemgr_passwd none reconfigure
http_access allow purge localhost
http_access allow cachemgr cachemgrip
http_access allow purge purgeip
http_access allow purge to_localhost
http_access deny purge
acl FTP proto FTP
always_direct allow FTP
acl POST method POST
no_cache deny POST
acl src_local src 127.0.0.0/8


#流量监控
acl cactiserver src 127.0.0.1
acl SNMP snmp_community passwd
snmp_port 3401
snmp_access allow SNMP cactiserver
snmp_access deny all

