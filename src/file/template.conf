#通用域名替换字符标记为.cRealmName.com
#通用域名替换字符标记带字符为signcRealmName
#peer______________________________________________________________________
cache_peer 58.59.102.50 parent 8086 0 no-query originserver no-digest name=www.29.com
cache_peer_domain www.cRealmName www.cRealmName litscloud.fuao2008.com

#acl mtime dstdomain .test.com

#许可哪些站可以取得真实客户端IP
#allow_web_GetCip
acl my_other_proxy srcdomain .cRealmName

#防盗链许可,基础服务
#stop_steallink_server
acl writelistdomain referer_regex -i ^http://[a-zA-Z0-9].*\.litscloud\.com ^http://[a-zA-Z0-9].*\.fuao2008\.com 
acl nulref referer_regex ^$
acl hasref referer_regex -i.+
acl litscloudsfileurl url_regex -i .bmp$ .png$ .jpg$ .gif$ .jpeg$ .rar$
acl yhballowv browser -i ^nsplayer ^contype$ ^rma ^windows-media-player ^foobar2000
acl wmvurl url_regex -i \.wmv$ \.mp3$ \.rm$ \.avi$ \.asf$ \.mpg$ \.mpeg$ \.rmvb$ \.wma$

deny_info http://www.cRealmName/imgaes/Logo1.gif allow_referer

http_access allow litscloudsfileurl writelistdomain
http_access allow litscloudsfileurl nulref
http_access allow writelistdomain wmvurl

#防盗链许可,高级cookies设置,高级计费服务
#暂略,需要源站程序配合

#不缓存动态页
#Nocache_dynamic_page 
acl QUERY urlpath_regex -i ^http://[a-zA-Z0-9].*\.signcRealmName/.*\.(php|xml|jsp|asp|aspx|php|jsp|cgi|fcgi|lsp|rb|pl|py|cfm|do|action|faces)
no_cache deny QUERY
#不缓存文件类型
acl QUERY urlpath_regex -i ^http://[a-zA-Z0-9].*\.signcRealmName/.*\.(xml|rar)
no_cache deny QUERY

#不缓存某些文件
#acl QUERY urlpath_regex -i ^http://[a-zA-Z0-9].*\.signcRealmName/\aaa.exe
#no_cache deny QUERY
 
#不缓存服务端加密路径
#NOcache_Server_passwordPath
acl denyssl urlpath_regex -i ^https:\\ ^ssl:\\
no_cache deny denyssl

#不缓存带？号的路径
#Nocachehave?_path
acl dy_cache urlpath_regex -i ^http://[a-zA-Z0-9].*\.signcRealmName/.*\.(swf|html|htm|exe|css|js|cab|asp|aspx|php|jsp)?
no_cache deny dy_cache

#不缓存某个具体(或者全站) 路径的demo
#Nocache_some_webpathdemo
#acl dy_page url_regex -i ^http:\/\/www\.signcRealmName\/.*\?.*$ 
#no_cache deny dy_page

