#防盗链许可,基础服务
#stop_steallink_server
acl yhballow referer_regex -i^http://[a-zA-Z0-9].*\.litscloud\.com 
acl nulref referer_regex ^$
acl hasref referer_regex -i.+
acl picurl url_regex -i .bmp$ .png$ .jpg$ .gif$ .jpeg$ .rar$
acl yhballowv browser -i ^nsplayer ^contype$ ^rma ^windows-media-player ^foobar2000
acl wmvurl url_regex -i \.wmv$ \.mp3$ \.rm$ \.avi$ \.asf$ \.mpg$ \.mpeg$ \.rmvb$ \.wma$

deny_info http://www.litscloud.com/imgaes/Logo1.gif allow_referer

http_access allow picurl yhballow
http_access allow picurl nulref
http_access allow yhballowv wmvurl

