#peer______________________________________________________________________
cache_peer 58.59.102.50 parent 8086 0 no-query originserver no-digest name=www.litscloud.com
cache_peer_domain www.litscloud.com www.litscloud.com litscloud.com litscloud.fuao2008.com

#acl mtime dstdomain .test.com

#许可哪些站可以取得真实客户端IP
#allow_web_GetCip
acl my_other_proxy srcdomain .litscloud.com

hierarchy_stoplist cgi-bin ?
hierarchy_stoplist -i ^https:\\ ?
#不缓存动态页
#Nocache_dynamic_page 
acl QUERY urlpath_regex -i cgi-bin \? \.php \.xml \.jsp \.asp \.aspx \.php \.jsp \.cgi \.fcgi \.lsp \.rb \.pl \.py \.cfm \.do \.action \.faces
no_cache deny QUERY
#cache deny QUERY
 
#不缓存服务端加密路径
#NOcache_Server_passwordPath
acl denyssl urlpath_regex -i ^https:\\
no_cache deny denyssl

#不缓存带？号的路径
#Nocachehave?_path
acl dy_cache urlpath_regex swf\?
acl dy_cache urlpath_regex html\?
acl dy_cache urlpath_regex htm\?
acl dy_cache urlpath_regex exe\?
acl dy_cache urlpath_regex css\?
acl dy_cache urlpath_regex js\?
acl dy_cache urlpath_regex cab\?
acl dy_cache urlpath_regex asp\?
acl dy_cache urlpath_regex aspx\?
acl dy_cache urlpath_regex php\?
acl dy_cache urlpath_regex jsp\?
no_cache deny dy_cache

